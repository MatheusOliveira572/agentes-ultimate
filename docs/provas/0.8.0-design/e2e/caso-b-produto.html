<!doctype html>
<!-- Contraste medido no pior ponto do fundo (fotos vivas passando por baixo): a 1ª versão (vidro 72%, destaque #0a62cf/#5aa2ff)
     ficou em 2,56:1 no rótulo da aba no escuro; subiu a opacidade e o tom do texto, como manda apple/materiais.md. -->
<!-- Caso B, produto: tela de app em que o vidro fica só na navegação e nos controles que flutuam sobre o conteúdo
     (barra superior e barra de abas), nunca nos cartões de conteúdo (apple/materiais.md: "Nunca na camada de conteúdo").
     No máximo 2 superfícies de vidro visíveis, nunca vidro sobre vidro. Dados fictícios. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Fotos da viagem</title>
<style>
  :root {
    --fundo: #f2f2f7; --superficie: #ffffff; --texto: #1d1d1f; --texto-2: #4a4a52; --destaque: #0054b8;
    --vidro: rgb(249 249 251 / 0.84); --vidro-borda: rgb(0 0 0 / 0.08); --vidro-opaco: #f9f9fb;
    --sombra: 0 1px 2px rgb(0 0 0 / 0.06), 0 6px 16px rgb(0 0 0 / 0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fundo: #000000; --superficie: #1c1c1e; --texto: #f5f5f7; --texto-2: #d1d1d6; --destaque: #8cc4ff;
      --vidro: rgb(28 28 30 / 0.86); --vidro-borda: rgb(255 255 255 / 0.1); --vidro-opaco: #1c1c1e;
      --sombra: 0 1px 2px rgb(0 0 0 / 0.5), 0 6px 16px rgb(0 0 0 / 0.4);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fundo); color: var(--texto); font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .vidro { background: var(--vidro); -webkit-backdrop-filter: blur(16px) saturate(170%); backdrop-filter: blur(16px) saturate(170%); }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .vidro { background: var(--vidro-opaco); } }
  @media (prefers-reduced-transparency: reduce) { .vidro { background: var(--vidro-opaco); -webkit-backdrop-filter: none; backdrop-filter: none; } }
  @media (prefers-contrast: more) { .vidro { background: var(--vidro-opaco); } :root { --texto-2: var(--texto); --vidro-borda: var(--texto); } }
  .topo { position: fixed; top: 0; left: 0; right: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px; border-bottom: 1px solid var(--vidro-borda); }
  .topo h1 { margin: 0; font-size: 17px; font-weight: 600; }
  .topo button, .abas a { min-width: 44px; min-height: 44px; display: inline-grid; place-items: center; border: 1px solid transparent; background: none; color: var(--destaque); font: inherit; cursor: pointer; border-radius: 12px; text-decoration: none; }
  .topo button:focus-visible, .abas a:focus-visible { outline: 3px solid var(--destaque); outline-offset: 2px; }
  .abas { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 2; display: flex; gap: 4px; padding: 6px;
    border-radius: 24px; border: 1px solid var(--vidro-borda); box-shadow: var(--sombra); }
  .abas a { flex-direction: column; gap: 2px; padding: 4px 14px; font-size: 11px; color: var(--texto-2); }
  .abas a[aria-current="page"] { color: var(--destaque); }
  .abas svg, .topo svg { width: 24px; height: 24px; }
  /* Conteúdo: cartões sólidos, sem vidro. */
  .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; padding: 76px 16px 112px; max-width: 1200px; margin: 0 auto; }
  .foto { margin: 0; border-radius: 14px; overflow: hidden; background: var(--superficie); box-shadow: var(--sombra); }
  .foto div { aspect-ratio: 4 / 3; }
  .foto figcaption { padding: 8px 10px 10px; font-size: 14px; }
  .foto figcaption small { display: block; color: var(--texto-2); font-size: 13px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-voltar" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-busca" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16l4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-fotos" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="1.75"/><path d="M4 16l5-5 4 4 2-2 5 5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/></symbol>
  <symbol id="i-album" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="1.75"/><rect x="13" y="4" width="7" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="1.75"/><rect x="4" y="13" width="7" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="1.75"/><rect x="13" y="13" width="7" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="1.75"/></symbol>
  <symbol id="i-pessoa" viewBox="0 0 24 24"><circle cx="12" cy="9" r="3.5" fill="none" stroke="currentColor" stroke-width="1.75"/><path d="M5 19c1.5-3.5 4-5 7-5s5.5 1.5 7 5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></symbol>
</svg>
<header class="topo vidro">
  <button type="button" aria-label="Voltar"><svg aria-hidden="true"><use href="#i-voltar"/></svg></button>
  <h1>Viagem ao litoral</h1>
  <button type="button" aria-label="Buscar"><svg aria-hidden="true"><use href="#i-busca"/></svg></button>
</header>
<main class="grade" id="grade"></main>
<nav class="abas vidro" aria-label="Seções">
  <a href="#" aria-current="page"><svg aria-hidden="true"><use href="#i-fotos"/></svg>Fotos</a>
  <a href="#"><svg aria-hidden="true"><use href="#i-album"/></svg>Álbuns</a>
  <a href="#"><svg aria-hidden="true"><use href="#i-pessoa"/></svg>Pessoas</a>
</nav>
<script>
  // Fotos fictícias: gradientes coloridos e vivos atrás das barras, o pior caso para o texto sobre o vidro.
  const cores = [['#ff8a3d', '#ffd36e'], ['#1e88e5', '#7fd3ff'], ['#2e7d32', '#a5d6a7'], ['#6a1b9a', '#f48fb1'], ['#111111', '#555555'], ['#fafafa', '#ffe082'], ['#00897b', '#80deea'], ['#d84315', '#ffab91']];
  const nomes = ['Praia ao nascer do sol', 'Mergulho', 'Trilha', 'Pôr do sol', 'Noite no píer', 'Areia branca', 'Lagoa', 'Fogueira'];
  const g = document.getElementById('grade');
  for (let i = 0; i < 24; i++) {
    const [a, b] = cores[i % cores.length];
    const f = document.createElement('figure'); f.className = 'foto';
    const d = document.createElement('div'); d.style.background = 'linear-gradient(135deg, ' + a + ', ' + b + ')';
    const c = document.createElement('figcaption'); c.textContent = nomes[i % nomes.length];
    const s = document.createElement('small'); s.textContent = (i % 28 + 1) + ' de outubro'; c.appendChild(s);
    f.append(d, c); g.appendChild(f);
  }
</script>
</body>
</html>
