<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>render</title></head>
<!-- Página de trabalho do gerar-fotos.js: renderiza uma cena de fotos-webgl.js e devolve WebP + grade de luminância 8 × 8. -->
<body><script src="fotos-webgl.js"></script><script>
window.renderizar = (nome, semente, w, h) => {
  const c = Fotos.render(nome, semente, w, h); if (!c) return null;
  const p = document.createElement('canvas'); p.width = p.height = 24; const g = p.getContext('2d'); g.drawImage(c, 0, 0, 24, 24);
  const d = g.getImageData(0, 0, 24, 24).data; const f = (v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; };
  const grade = new Array(64).fill(0); let s = 0;
  for (let i = 0; i < d.length; i += 4) { const L = 0.2126 * f(d[i]) + 0.7152 * f(d[i + 1]) + 0.0722 * f(d[i + 2]); s += L; const q = i / 4; grade[Math.floor(Math.floor(q / 24) / 3) * 8 + Math.floor((q % 24) / 3)] += L / 9; }
  return { webp: c.toDataURL('image/webp', 0.86).split(',')[1], lum: +(s / 576).toFixed(3), grade: grade.map((x) => +x.toFixed(3)) };
};
</script></body></html>
