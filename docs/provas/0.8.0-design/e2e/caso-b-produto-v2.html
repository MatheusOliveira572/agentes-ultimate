<!doctype html>
<!-- Caso B, tela de produto v2 (pv94, designer-paineis): álbum "Viagem ao litoral" de um app de fotos fictício.
     Ideia: "a luz da viagem atravessa o vidro". As fotos são a luz; os controles são Liquid Glass (liquido.css/js): entortam o
     que passa atrás na borda, pegam a cor e o tom das fotos e o brilho do aro segue a mesma luz (o ponteiro) que inclina as
     fotos. Vidro só em navegação e controles (HIG › Materials: nunca no conteúdo); as fotos são sólidas.
     Conteúdo do caso-b-produto.html mantido: 24 fotos, mesmos nomes e datas (1 a 24 de outubro), abas Fotos/Álbuns/Pessoas.
     As "fotos" são paisagens pintadas por código (canvas), ilustrativas: não há foto real nem de banco. Os 3 lugares são fictícios. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Viagem ao litoral · Fotos</title>
<link rel="stylesheet" href="../../../../modelos/liquid-glass/liquido.css">
<style>
  :root {
    --fonte: "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    --fonte-exib: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    --fundo: #fbfbfd; --texto: #1d1d1f; --texto-2: #5c5c63; --acento: #0a63d6; --linha: rgb(0 0 0 / 0.08);
    --mola-resposta: linear(0, 0.0199, 0.066, 0.1307, 0.2016, 0.2784, 0.3547, 0.4254, 0.4941, 0.5573, 0.6128, 0.6644, 0.7088, 0.7495, 0.7852, 0.8153, 0.8424, 0.8659, 0.8854, 0.9029, 0.9173, 0.9301, 0.941, 0.95, 0.9579, 0.9646, 0.9701, 0.9749, 0.9788, 0.9822, 0.9851, 0.9875, 0.9895, 0.9913, 0.9927, 0.9939, 0.9949, 0.9957, 0.9964, 0.997, 0.9975, 0.9979, 0.9983, 0.9986, 0.9988, 0.999, 0.9992, 0.9993, 1); --mola-resposta-ms: 663ms; /* duração 0.42, bounce 0, assenta em 663 ms, passa -0.1% */
    --mola-objeto: linear(0, 0.0176, 0.062, 0.1241, 0.197, 0.2752, 0.3547, 0.4326, 0.5067, 0.5759, 0.6391, 0.6961, 0.7468, 0.7914, 0.83, 0.8633, 0.8915, 0.9152, 0.935, 0.9513, 0.9645, 0.9751, 0.9836, 0.9902, 0.9952, 0.999, 1.0017, 1.0036, 1.0049, 1.0056, 1.0059, 1.006, 1.0058, 1.0055, 1.0051, 1.0047, 1.0042, 1.0037, 1.0033, 1.0028, 1.0024, 1.0021, 1.0017, 1.0014, 1.0012, 1.001, 1.0008, 1.0006, 1); --mola-objeto-ms: 744ms; /* duração 0.5, bounce 0.15, assenta em 744 ms, passa 0.6% */
    --mola-pico: linear(0, 0.023, 0.0795, 0.1609, 0.2536, 0.3548, 0.4538, 0.5513, 0.6395, 0.7212, 0.791, 0.8524, 0.9024, 0.9442, 0.9771, 1.0016, 1.02, 1.0323, 1.0403, 1.0443, 1.0454, 1.0444, 1.0417, 1.0381, 1.0338, 1.0292, 1.0247, 1.0203, 1.0163, 1.0126, 1.0094, 1.0066, 1.0044, 1.0025, 1.001, 0.9999, 0.9991, 0.9985, 0.9982, 0.998, 0.9979, 0.998, 0.9981, 0.9983, 0.9985, 0.9987, 0.9989, 0.9991, 1); --mola-pico-ms: 925ms; /* duração 0.55, bounce 0.3, assenta em 925 ms, passa 4.5% */
    --mola: var(--mola-objeto);
    --lateral: 256px;
  }
  @media (prefers-color-scheme: dark) { :root { --fundo: #0a0a0b; --texto: #f5f5f7; --texto-2: #a8a8b0; --acento: #5ea4ff; --linha: rgb(255 255 255 / 0.1); } }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased; }
  body { margin: 0; background: var(--fundo); color: var(--texto); font: 15px/1.45 var(--fonte); }
  button { font: inherit; color: inherit; background: none; border: 1px solid transparent; padding: 0; cursor: pointer; }
  :focus-visible { outline: 2.5px solid var(--acento); outline-offset: 3px; }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  svg.i { width: 20px; height: 20px; flex: none; }
  .pular { position: absolute; left: 12px; top: -60px; z-index: 30; background: var(--acento); color: #fff; padding: 10px 14px; border-radius: 12px; }
  .pular:focus { top: 12px; }

  /* ===== Capa: a foto que abre o álbum, sangrando por trás da barra lateral ===== */
  .capa { position: relative; height: 500px; overflow: hidden; }
  .capa img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; object-fit: cover; }
  .capa::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgb(0 0 0 / 0) 28%, rgb(0 0 0 / 0.42) 58%, rgb(0 0 0 / 0.80) 100%); }
  .capa-texto { position: absolute; z-index: 1; left: calc(var(--lateral) + 40px); right: 40px; bottom: 34px; color: #fff; }
  .capa h1 { margin: 0; font: 700 68px/1 var(--fonte-exib); letter-spacing: -0.035em; text-wrap: balance; }
  .capa p { margin: 10px 0 0; font-size: 17px; color: rgb(255 255 255 / 0.92); font-variant-numeric: tabular-nums; }
  .capa .ilustr { margin-top: 6px; font-size: 13px; color: rgb(255 255 255 / 0.86); }

  /* ===== Barra lateral (Liquid Glass, flutua; a capa passa por trás) ===== */
  .lateral { position: fixed; z-index: 10; left: 12px; top: 12px; bottom: 12px; width: calc(var(--lateral) - 24px); padding: 18px 10px 14px; border-radius: 28px;
    --lg-raio: 28px; --lg-recuo: 10px; display: flex; flex-direction: column; gap: 20px;
    --lg-tinta: rgb(255 255 255 / 0.72); }   /* superfície grande: material mais grosso que o dos controles */
  @media (prefers-color-scheme: dark) { .lateral.lg { --lg-tinta: rgb(26 26 30 / 0.76); } }
  .lateral .app { display: flex; align-items: center; gap: 10px; padding: 0 10px; font: 700 20px/1 var(--fonte-exib); letter-spacing: -0.02em; }
  .lateral h2 { margin: 0 0 4px 12px; font-size: 12px; font-weight: 650; color: var(--lg-texto-2); }
  .lateral ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .lateral a { display: flex; align-items: center; gap: 10px; min-height: 36px; padding: 0 12px; border-radius: 18px; color: var(--lg-texto); text-decoration: none; font-weight: 500; }
  .lateral a small { margin-left: auto; color: var(--lg-texto-2); font-variant-numeric: tabular-nums; font-size: 13px; }
  .lateral a[aria-current="page"] { font-weight: 650; }
  .lateral a .mini { width: 22px; height: 22px; border-radius: 6px; overflow: hidden; flex: none; }
  .lateral a .mini img { width: 100%; height: 100%; display: block; object-fit: cover; }
  @media (hover: hover) { .lateral a:not([aria-current]):hover { background: rgb(127 127 140 / 0.14); } }

  /* ===== Barra de ferramentas (cápsulas de vidro, adaptam o tom ao que passa atrás) ===== */
  .ferramentas { position: fixed; z-index: 10; top: 16px; right: 18px; display: flex; gap: 10px; }
  .capsula { display: flex; align-items: center; height: 44px; padding: 0 4px; border-radius: 22px; --lg-raio: 22px; --lg-recuo: 4px; }
  .capsula button { display: inline-flex; align-items: center; gap: 7px; height: 36px; min-width: 36px; padding: 0 12px; border-radius: 18px; font-weight: 600; font-size: 14.5px; justify-content: center; }
  .capsula.redonda { width: 44px; padding: 0; justify-content: center; }
  .capsula.redonda button { padding: 0; }
  .capsula .sep { width: 1px; height: 18px; background: currentColor; opacity: 0.22; }
  @media (hover: hover) { .capsula button:hover { background: rgb(127 127 140 / 0.18); } }
  .voltar { display: none; }

  /* ===== Fotos: mosaico por lugar ===== */
  main { position: relative; }
  .lugares { position: relative; padding: 8px 32px 120px calc(var(--lateral) + 24px); }
  /* Extensão de fundo (macOS 26: o conteúdo junto da barra lateral continua por baixo dela, espelhado e desfocado),
     para o vidro ter conteúdo atrás do começo ao fim, sem corte onde a capa acaba. */
  /* A máscara termina antes da borda direita da barra (12 + lateral − 24 = lateral − 12 px): nada vaza para o mosaico. */
  .extensao { position: absolute; z-index: 0; left: 0; top: 0; bottom: 0; width: var(--lateral); overflow: hidden; pointer-events: none;
    -webkit-mask: linear-gradient(90deg, #000 calc(100% - 40px), transparent calc(100% - 14px)); mask: linear-gradient(90deg, #000 calc(100% - 40px), transparent calc(100% - 14px)); }
  .extensao canvas { position: absolute; inset: -40px -40px -40px -40px; width: calc(100% + 80px); height: calc(100% + 80px); filter: blur(10px) saturate(1.15); }
  .lugar, .rodape { position: relative; z-index: 1; }
  @media (prefers-color-scheme: dark) { .extensao canvas { filter: blur(10px) saturate(1.15) brightness(0.72); } }
  .lugar { margin-top: 44px; }
  .lugar header { display: flex; align-items: baseline; gap: 12px; margin: 0 4px 16px; }
  .lugar h2 { margin: 0; font: 700 28px/1.1 var(--fonte-exib); letter-spacing: -0.025em; }
  .lugar header p { margin: 0; color: var(--texto-2); font-size: 15px; font-variant-numeric: tabular-nums; }
  .lugar { container-type: inline-size; }
  .mosaico { --col: 6; --vao: 6px; display: grid; grid-template-columns: repeat(var(--col), minmax(0, 1fr));
    grid-auto-rows: calc((100cqw - (var(--col) - 1) * var(--vao)) / var(--col)); gap: var(--vao); grid-auto-flow: dense; }
  .foto { position: relative; display: block; width: 100%; height: 100%; border-radius: 12px; overflow: hidden; background: #888; padding: 0;
    transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform 500ms var(--mola-objeto), box-shadow 300ms ease; }
  .foto.g { grid-column: span 2; grid-row: span 2; }
  .foto.l { grid-column: span 2; }
  .foto img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; object-fit: cover; }
  @supports (corner-shape: squircle) { .foto { corner-shape: squircle; border-radius: 18px; } }
  .foto::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    box-shadow: inset 0 0 0 0.5px rgb(0 0 0 / 0.14); background: radial-gradient(80% 80% at var(--bx, 30%) var(--by, 0%), rgb(255 255 255 / var(--brilho, 0)), transparent 60%); }
  @media (prefers-color-scheme: dark) { .foto::after { box-shadow: inset 0 0 0 0.5px rgb(255 255 255 / 0.14); } }
  .legenda { position: absolute; z-index: 1; left: 0; right: 0; bottom: 0; padding: 64px 16px 14px; text-align: left; color: #fff;
    background: linear-gradient(180deg, rgb(0 0 0 / 0), rgb(0 0 0 / 0.55) 45%, rgb(0 0 0 / 0.74)); opacity: 0; transition: opacity 200ms ease; }
  .legenda b { display: block; font-size: 15px; font-weight: 650; }
  .legenda small { font-size: 13px; color: rgb(255 255 255 / 0.9); font-variant-numeric: tabular-nums; }
  .foto.g .legenda { opacity: 1; }
  .foto.g .legenda b { font: 650 20px/1.2 var(--fonte-exib); letter-spacing: -0.015em; }
  .foto:focus-visible .legenda { opacity: 1; }
  @media (hover: hover) { .foto:hover .legenda { opacity: 1; } .foto:hover { box-shadow: 0 18px 40px -16px rgb(0 0 0 / 0.45); z-index: 2; } }
  .rodape { margin: 48px 4px 0; color: var(--texto-2); font-size: 13px; }

  /* ===== Abas no celular (Liquid Glass: cápsula + busca separada) ===== */
  .abas { display: none; }

  /* ===== Movimento ===== */
  @media (prefers-reduced-motion: no-preference) {
    @supports (animation-timeline: view()) {
      /* As fotos pousam ao entrar na tela: sobem e deitam (inclinação 3D), na rolagem, sem prender nada. */
      .foto { animation: pousa linear both; animation-timeline: view(); animation-range: entry 0% entry 85%; }
      @keyframes pousa { from { opacity: 0.2; transform: perspective(1100px) translateY(28px) rotateX(9deg) scale(0.965); } }
    }
    .entrada .capa-texto > * { animation: sobe var(--mola-objeto-ms) var(--mola-objeto) both; }
    .entrada .capa-texto p { animation-delay: 80ms; }
    .entrada .lateral, .entrada .ferramentas > * { animation: surge var(--mola-objeto-ms) var(--mola-objeto) both; animation-delay: 120ms; }
    .entrada .ferramentas > :nth-child(2) { animation-delay: 170ms; }
    @keyframes sobe { from { opacity: 0; transform: translateY(18px); } }
    @keyframes surge { from { opacity: 0; transform: scale(0.94); } }
  }

  /* ===== Celular ===== */
  @media (max-width: 760px) {
    :root { --lateral: 0px; }
    .lateral { display: none; }
    .capa { height: 380px; }
    .capa-texto { left: 20px; right: 20px; bottom: 24px; }
    .capa h1 { font-size: 38px; }
    .capa p { font-size: 15px; }
    .ferramentas { top: calc(12px + env(safe-area-inset-top)); right: 14px; left: 14px; }
    .voltar { display: flex; margin-right: auto; }
    .ferramentas { gap: 8px; }
    .capsula .rot { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .capsula button { padding: 0 11px; }
    .lugares { padding: 0 0 130px; }
    .extensao { display: none; }
    .lugar { margin-top: 30px; }
    .lugar header { margin: 0 16px 10px; flex-wrap: wrap; row-gap: 0; }
    .lugar h2 { font-size: 22px; }
    .mosaico { --col: 3; --vao: 2px; }
    .foto { border-radius: 0; }
    .foto.g .legenda { padding: 30px 12px 10px; }
    .foto.g .legenda b { font-size: 17px; }
    .rodape { margin: 28px 16px 0; }
    .abas { position: fixed; z-index: 10; left: 14px; right: 14px; bottom: calc(18px + env(safe-area-inset-bottom)); display: flex; gap: 10px; align-items: center; }
    .abas nav { flex: 1; display: flex; height: 62px; padding: 4px; border-radius: 31px; --lg-raio: 31px; --lg-recuo: 4px;
      transition: flex-grow 520ms var(--mola-objeto); }
    .abas a { flex: 1; display: grid; justify-items: center; align-content: center; gap: 1px; border-radius: 27px; color: var(--lg-texto); text-decoration: none;
      font-size: 11px; font-weight: 600; min-width: 44px; transition: flex-grow 520ms var(--mola-objeto), opacity 200ms ease; }
    .abas a svg { width: 24px; height: 24px; }
    .abas a[aria-current="page"] { color: var(--acento-vidro, var(--lg-texto)); }
    .abas .busca { width: 62px; height: 62px; border-radius: 31px; display: grid; place-items: center; --lg-raio: 31px; flex: none; }
    .abas .busca svg { width: 24px; height: 24px; }
    /* Ao rolar para baixo, as abas se recolhem só na selecionada e a busca se aproxima (camadas que se separam e se juntam). */
    .compacto .abas nav { flex-grow: 0; }
    .compacto .abas a:not([aria-current]) { flex-grow: 0; width: 0; min-width: 0; opacity: 0; overflow: hidden; pointer-events: none; }
    .compacto .abas a[aria-current] { width: 62px; flex: none; }
    .compacto .abas a span { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0.01ms !important; animation: none !important; } }
  /* ===== Visor: a foto aberta em tela cheia (a mesma foto cresce da grade; os controles de vidro chegam depois) ===== */
  .visor { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; }
  .visor[hidden] { display: none; }
  .visor-fundo { position: absolute; inset: 0; background: var(--fundo); view-transition-name: visor-fundo; }
  .visor-foto { position: relative; width: min(calc(100vw - 200px), calc(100vh - 150px)); aspect-ratio: 1; object-fit: cover; border-radius: 6px;
    box-shadow: 0 0 0 0.5px rgb(0 0 0 / 0.12), 0 2px 4px rgb(0 0 0 / 0.08), 0 24px 60px -20px rgb(0 0 0 / 0.45); }
  .visor-barra { position: absolute; top: 16px; left: 18px; right: 18px; display: flex; align-items: center; gap: 10px; view-transition-name: visor-barra; }
  .visor-barra .capsula:nth-child(2) { margin: 0 auto; padding: 0 18px; flex-direction: column; justify-content: center; align-items: center; gap: 0; }
  .visor-barra .capsula:nth-child(2) b { font: 650 14.5px/1.15 var(--fonte); letter-spacing: -0.01em; }
  .visor-barra .capsula:nth-child(2) small { font-size: 12px; line-height: 1.2; color: var(--lg-texto-2); font-variant-numeric: tabular-nums; }
  @media (max-width: 760px) { .visor-foto { width: 100vw; border-radius: 0; } .visor-barra { top: calc(12px + env(safe-area-inset-top)); left: 12px; right: 12px; } }
  @media (prefers-reduced-motion: no-preference) {
    /* ordem explícita: fundo < foto < barras (sem isso a foto que cresce passa por baixo do fundo do visor) */
    ::view-transition-group(visor-fundo) { z-index: 1; }
    ::view-transition-group(foto-aberta) { z-index: 2; animation-duration: var(--mola-objeto-ms); animation-timing-function: var(--mola-objeto); }
    ::view-transition-group(visor-barra) { z-index: 3; }
    ::view-transition-old(foto-aberta), ::view-transition-new(foto-aberta) { height: 100%; object-fit: cover; animation-duration: 220ms; }
    ::view-transition-old(root), ::view-transition-new(root) { animation: none; }
    ::view-transition-new(visor-fundo) { animation: 260ms ease-out both aparece; }
    ::view-transition-old(visor-fundo) { animation: 220ms ease-in both some; }
    ::view-transition-new(visor-barra) { animation: var(--mola-objeto-ms) var(--mola-objeto) 140ms both desce; }
    ::view-transition-old(visor-barra) { animation: 140ms ease-in both some; }
    @keyframes aparece { from { opacity: 0; } }
    @keyframes some { to { opacity: 0; } }
    @keyframes desce { from { opacity: 0; transform: translateY(-10px) scale(0.98); } }
  }
</style>
</head>

  <div class="capsula redonda lg" data-lg-adapta="[data-lum]"><button type="button" aria-label="Mais ações"><svg class="i" aria-hidden="true"><use href="#i-mais"/></svg></button></div>

<main id="fotos" tabindex="-1">
  <header class="capa" data-lum="0.5">

<div class="visor" id="visor" hidden role="dialog" aria-modal="true" aria-labelledby="visor-titulo">
  <div class="visor-fundo"></div>
  <img class="visor-foto" id="visor-foto" src="img/foto-3.webp" alt="" data-lum="0.5">
  <div class="visor-barra">
    <div class="capsula redonda lg" data-lg-adapta="#visor [data-lum]"><button type="button" class="visor-fechar" aria-label="Fechar a foto"><svg class="i" aria-hidden="true"><use href="#i-voltar"/></svg></button></div>
    <div class="capsula lg" data-lg-adapta="#visor [data-lum]"><b id="visor-titulo"></b><small id="visor-data"></small></div>
    <div class="capsula lg" data-lg-adapta="#visor [data-lum]" role="toolbar" aria-label="Ações da foto">
      <button type="button" aria-label="Favoritar"><svg class="i" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 19.5s-7-4.3-7-9.3A3.9 3.9 0 0112 8a3.9 3.9 0 017 2.2c0 5-7 9.3-7 9.3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></button>

    <a href="#"><svg aria-hidden="true"><use href="#i-album"/></svg><span>Álbuns</span></a>

<script src="img/fotos-lum.js"></script>
<script>
const semMov = matchMedia('(prefers-reduced-motion: reduce)');
/* ---------- Fotos: renderizadas uma vez por fotos-webgl.js (gerar-fotos.js), lidas como imagem; luminância em img/fotos-lum.js ---------- */
const LUM = window.FOTOS_LUM || {};
function luz(el, chave) { const l = LUM[chave]; if (!l) return; el.dataset.lum = l.lum; el.dataset.lumGrade = l.grade.join(','); }

/* ---------- Dados: os 24 do caso B original (mesmos nomes e datas) ---------- */
const NOMES = ['Praia ao nascer do sol', 'Mergulho', 'Trilha', 'Pôr do sol', 'Noite no píer', 'Areia branca', 'Lagoa', 'Fogueira'];
const FOTOS = Array.from({ length: 24 }, (_, i) => ({ nome: NOMES[i % 8], dia: i + 1 }));
const LUGARES = [['Ilhabela', 0, 8], ['Paraty', 8, 16], ['Ubatuba', 16, 24]];
/* Um arranjo por lugar (o destaque muda de lado), para o álbum não ler como molde repetido. Cada linha soma 12 células. */
const FORMAS = { largo: [['g', '', '', '', '', 'l', '', ''], ['', '', 'g', '', '', '', 'l', ''], ['l', '', '', 'g', '', '', '', '']],
  estreito: [['g', '', '', '', '', '', 'l', ''], ['', 'l', 'g', '', '', '', '', ''], ['', '', '', 'g', '', '', '', 'l']] };

function montar() {
  const largo = innerWidth > 760; const jogos = largo ? FORMAS.largo : FORMAS.estreito; let jogo = 0;
  const L = document.getElementById('lugares'); L.innerHTML = '';
  for (const [nome, a, b] of LUGARES) { const formas = jogos[jogo++];
    const s = document.createElement('section'); s.className = 'lugar'; s.setAttribute('aria-labelledby', 'l-' + nome);
    s.innerHTML = `<header><h2 id="l-${nome}">${a + 1} a ${b} de outubro</h2><p>${nome} · ${b - a} fotos</p></header>`;
    const m = document.createElement('div'); m.className = 'mosaico';
    FOTOS.slice(a, b).forEach((f, k) => {
      const bt = document.createElement('button'); bt.type = 'button'; bt.className = 'foto ' + formas[k]; bt.dataset.lum = '0.5';
      bt.setAttribute('aria-label', `${f.nome}, ${f.dia} de outubro`);
      const ind = a + k; luz(bt, 'foto-' + ind); bt.dataset.ind = ind;
      bt.innerHTML = `<img src="img/foto-${ind}.webp" alt="" decoding="async"><span class="legenda${formas[k] === 'g' ? ' sobre-foto' : ''}" aria-hidden="true"><b>${f.nome}</b><small>${f.dia} de outubro</small></span>`;
      m.appendChild(bt);
    });
    s.appendChild(m); L.appendChild(s);
  }
  L.insertAdjacentHTML('beforeend', `<p class="rodape">${FOTOS.length} fotos · imagens renderizadas por um shader WebGL próprio (fotos-webgl.js), sem foto real nem arte de terceiros</p>`);
  requestAnimationFrame(() => {
    luz(document.querySelector('.capa'), 'capa');
    document.getElementById('fixados').innerHTML = [['Viagem ao litoral', 24, 3, true], ['Família', 312, 6], ['Receitas', 58, 7]].map(([n, c, p, at]) =>
      `<li><a href="#"${at ? ' aria-current="page" class="lg-sel"' : ''}><span class="mini"><img src="img/foto-${p}.webp" alt=""></span>${n}<small>${c}</small></a></li>`).join('');
    Promise.all([...document.images].map((im) => im.decode().catch(() => null))).then(() => { estender(); window.liquido && liquido.montar(); window.__pronto = true; });
  });
}
function estender() {
  const L = document.getElementById('lugares'); let ext = L.querySelector('.extensao');
  if (innerWidth <= 760) { ext && ext.remove(); return; }
  if (!ext) { ext = document.createElement('div'); ext.className = 'extensao'; ext.setAttribute('aria-hidden', 'true'); ext.innerHTML = '<canvas></canvas>'; L.prepend(ext); }
  const c = ext.querySelector('canvas'); const cw = c.clientWidth, ch = c.clientHeight; c.width = Math.round(cw / 2); c.height = Math.round(ch / 2);
  const g = c.getContext('2d'); const base = L.getBoundingClientRect(); const ox = 40, oy = 40;
  g.fillStyle = getComputedStyle(document.body).backgroundColor; g.fillRect(0, 0, c.width, c.height);
  // cada foto encostada na borda esquerda do mosaico é espelhada para baixo da barra (esticada para cobrir os vãos)
  const fotos = [...L.querySelectorAll('.foto')]; const esq = Math.min(...fotos.map((f) => f.getBoundingClientRect().left));
  const daBorda = fotos.filter((f) => Math.abs(f.getBoundingClientRect().left - esq) < 2);
  daBorda.forEach((f, k) => { const r = f.getBoundingClientRect(); const fc = f.querySelector('img');
    const y0 = k === 0 ? 0 : (r.top - base.top + oy) - 50, y1 = k === daBorda.length - 1 ? ch : (r.bottom - base.top + oy) + 50;
    g.save(); g.translate((r.left - base.left + ox) / 2, 0); g.scale(-1, 1); g.drawImage(fc, 0, y0 / 2, (r.left - base.left + ox) / 2 + 2, (y1 - y0) / 2); g.restore(); });
  // a capa continua no topo da extensão (cor real do pé da capa, esmaecendo em 180 px): sem linha seca na barra lateral
  let pc = [27, 18, 38, 255]; try { const ci = document.getElementById('capa'); const t = document.createElement('canvas'); t.width = 64; t.height = 4; const tg = t.getContext('2d'); tg.drawImage(ci, 0, ci.naturalHeight - 4, ci.naturalWidth * 0.2, 4, 0, 0, 64, 4); pc = tg.getImageData(0, 3, 64, 1).data; } catch { /* file:// sem acesso aos pixels: cor média do pé da capa medida na geração */ }
  let cr = 0, cg = 0, cb = 0, n = pc.length / 4; for (let i = 0; i < pc.length; i += 4) { cr += pc[i]; cg += pc[i + 1]; cb += pc[i + 2]; }
  const cor = (al) => 'rgba(' + Math.round(cr / n) + ',' + Math.round(cg / n) + ',' + Math.round(cb / n) + ',' + al + ')';
  const gr = g.createLinearGradient(0, 0, 0, (oy + 180) / 2); gr.addColorStop(0, cor(1)); gr.addColorStop(0.35, cor(0.85)); gr.addColorStop(1, cor(0)); g.fillStyle = gr; g.fillRect(0, 0, c.width, (oy + 180) / 2);
}
window.__pronto = false;
montar();
/* ---------- Visor: a foto da grade cresce até a tela cheia (View Transition); Esc ou o botão fecha e ela volta ao lugar ---------- */
const visor = document.getElementById('visor'), vfoto = document.getElementById('visor-foto'); let aberta = null;
function transicao(mudar) {
  if (!document.startViewTransition || semMov.matches) { mudar(); return null; }
  const vt = document.startViewTransition(mudar); window.__vt = vt; return vt;
}
function abrirFoto(bt) {
  const img = bt.querySelector('img'); const ind = +bt.dataset.ind; aberta = bt;
  img.style.viewTransitionName = 'foto-aberta';
  const vt = transicao(() => {
    img.style.viewTransitionName = '';
    vfoto.src = img.src; luz(vfoto, 'foto-' + ind); vfoto.style.viewTransitionName = 'foto-aberta';
    document.getElementById('visor-titulo').textContent = FOTOS[ind].nome; document.getElementById('visor-data').textContent = FOTOS[ind].dia + ' de outubro de 2026';
    visor.hidden = false; window.liquido && liquido.montar();
  });
  const foco = () => visor.querySelector('.visor-fechar').focus({ preventScroll: true });
  vt ? vt.updateCallbackDone.then(foco) : foco();
}
function fecharFoto() {
  if (!aberta) return; const bt = aberta, img = bt.querySelector('img'); aberta = null;
  const vt = transicao(() => { visor.hidden = true; vfoto.style.viewTransitionName = ''; img.style.viewTransitionName = 'foto-aberta'; });
  const fim = () => { img.style.viewTransitionName = ''; bt.focus({ preventScroll: true }); };
  vt ? vt.finished.then(fim) : fim();
}
document.getElementById('lugares').addEventListener('click', (e) => { const bt = e.target.closest('.foto'); if (bt) abrirFoto(bt); });
visor.querySelector('.visor-fechar').addEventListener('click', fecharFoto);
addEventListener('keydown', (e) => { if (e.key === 'Escape' && aberta) { e.preventDefault(); fecharFoto(); } });
let largoAntes = innerWidth > 760;
addEventListener('resize', () => { if ((innerWidth > 760) !== largoAntes) { largoAntes = !largoAntes; montar(); } });

/* ---------- A mesma luz: o ponteiro inclina as fotos e dá brilho do lado dela (o vidro segue a mesma luz em liquido.js) ---------- */
document.addEventListener('pointermove', (e) => {
  if (e.pointerType !== 'mouse' || semMov.matches) return;
  const f = e.target.closest && e.target.closest('.foto'); document.querySelectorAll('.foto.inclina').forEach((x) => { if (x !== f) { x.classList.remove('inclina'); x.style.removeProperty('--rx'); x.style.removeProperty('--ry'); x.style.setProperty('--brilho', 0); } });
  if (!f) return; const r = f.getBoundingClientRect(); const u = (e.clientX - r.left) / r.width, v = (e.clientY - r.top) / r.height;
  f.classList.add('inclina'); f.style.setProperty('--ry', ((u - 0.5) * 7).toFixed(2) + 'deg'); f.style.setProperty('--rx', ((0.5 - v) * 7).toFixed(2) + 'deg');
  f.style.setProperty('--bx', (u * 100).toFixed(0) + '%'); f.style.setProperty('--by', (v * 100).toFixed(0) + '%'); f.style.setProperty('--brilho', 0.22);
}, { passive: true });
/* Abas que se recolhem ao rolar para baixo e voltam ao subir (celular). */
let yAntes = 0;
addEventListener('scroll', () => { const y = scrollY; document.body.classList.toggle('compacto', y > 260 && y > yAntes); yAntes = y; }, { passive: true });
setTimeout(() => document.body.classList.remove('entrada'), 1500);
</script>
<script src="../../../../modelos/liquid-glass/liquido.js"></script>
</body>
