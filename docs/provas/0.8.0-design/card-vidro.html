<!DOCTYPE html>
<!-- exceção pedida: vidro em cartão de dado só nesta demo. conhecimento/design/apple/materiais.md reserva o vidro à camada funcional; aqui o usuário pediu. Spec: designer-paineis [cod:vd01]. Dados fictícios. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Resumo da conta — demonstração</title>
<style>
  :root {
    --fundo-base: #EEF1FA; --mancha-1: #6D5BF5; --mancha-2: #FF8A65; --mancha-3: #2EC4B6;
    --vidro: rgb(255 255 255 / 0.70); --vidro-reserva: rgb(255 255 255 / 0.92); --vidro-opaco: #FFFFFF;
    --vidro-blur: 16px; /* 20px a partir de 48rem */
    --vidro-sat: 170%;
    --vidro-realce: inset 0 1px 0 rgb(255 255 255 / 0.70);
    --vidro-sombra: 0 12px 32px rgb(15 17 21 / 0.14);
    --texto-1: #0F1115; --texto-2: #434A5C; --positivo: #085E32; --negativo: #A11D14;
    --acao: #2B3BC4; --acao-hover: #2232A8; --acao-ativo: #1A288C; --acao-texto: #FFFFFF; --foco: #2B3BC4;
    --inativo-fundo: rgb(67 74 92 / 0.16); --inativo-texto: #5B6070;
    --raio-cartao: 16px; --raio-botao: 12px;
    --e1: 4px; --e2: 8px; --e3: 12px; --e4: 16px; --e5: 20px; --e6: 24px; --e7: 28px; --e8: 32px; --e12: 48px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fundo-base: #0A0F1E; --mancha-1: #5B4BE0; --mancha-2: #E0603F; --mancha-3: #14A396;
      --vidro: rgb(28 28 30 / 0.66); --vidro-reserva: rgb(28 28 30 / 0.92); --vidro-opaco: #1C1C1E;
      --vidro-realce: inset 0 1px 0 rgb(255 255 255 / 0.14); --vidro-sombra: 0 12px 32px rgb(0 0 0 / 0.40);
      --texto-1: #F5F6FA; --texto-2: #C3C8D6; --positivo: #5EE3A1; --negativo: #FFA39A;
      --acao: #A9B4FF; --acao-hover: #BEC7FF; --acao-ativo: #949FF0; --acao-texto: #0A0F1E; --foco: #A9B4FF;
      --inativo-fundo: rgb(195 200 214 / 0.16); --inativo-texto: #9AA0B0;
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  html {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    color: var(--texto-1);
  }
  body { margin: 0; }

  /* Fundo: só as cores do tema (o contraste foi calculado contra elas). */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background-color: var(--fundo-base);
    background-image: radial-gradient(18rem 18rem at 22% 34%, var(--mancha-1) 0, transparent 60%), radial-gradient(16rem 16rem at 82% 66%, var(--mancha-2) 0, transparent 60%), radial-gradient(22rem 22rem at 50% 95%, var(--mancha-3) 0, transparent 60%);
  }

  .palco {
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: var(--e4);
  }

  .cartao {
    width: min(100%, 26rem);
    padding: var(--e5);
    display: flex;
    flex-direction: column;
    background: var(--vidro);
    -webkit-backdrop-filter: blur(var(--vidro-blur)) saturate(var(--vidro-sat));
    backdrop-filter: blur(var(--vidro-blur)) saturate(var(--vidro-sat));
    box-shadow: var(--vidro-realce), var(--vidro-sombra);
    border-radius: var(--raio-cartao);
    border: 0;
  }
  :where(.cartao) > :where(h1, p) { margin: 0; }

  .cartao__titulo {
    font-size: 1rem;
    line-height: 1.3;
    font-weight: 600;
    text-wrap: balance;
    color: var(--texto-1);
  }
  .cartao__saldo {
    margin-top: var(--e2);
    font-size: 2.25rem;
    line-height: 1.1;
    font-weight: 700;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    color: var(--texto-1);
  }
  .cartao__saldo--longo { font-size: 1.75rem; }
  .cartao__variacao {
    margin-top: var(--e2);
    font-size: 1rem;
    line-height: 1.4;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .cartao__variacao--positiva { color: var(--positivo); }
  .cartao__variacao--negativa { color: var(--negativo); }
  .cartao__variacao--zero { color: var(--texto-2); }
  .cartao__variacao--zero .cartao__seta { display: none; }
  .cartao__seta { vertical-align: -0.0625rem; }
  .cartao__variacao .num { white-space: nowrap; }
  .cartao__periodo { font-weight: 400; }
  .cartao__meta {
    margin-top: var(--e4);
    font-size: 0.875rem;
    line-height: 1.4;
    font-weight: 400;
    color: var(--texto-2);
  }
  .cartao__meta + .cartao__meta { margin-top: var(--e1); }
  .cartao__status {
    margin-top: var(--e2);
    font-size: 0.8125rem;
    line-height: 1.4;
    font-weight: 400;
    color: var(--texto-2);
  }
  .cartao__status:empty { display: none; }
  .cartao__aviso {
    margin-top: var(--e3);
    font-size: 0.8125rem;
    line-height: 1.4;
    font-weight: 400;
    color: var(--texto-2);
  }

  .sr {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  .botao {
    margin-top: var(--e6);
    width: 100%;
    min-height: 48px;
    padding: 0 var(--e6);
    border: 0;
    border-radius: var(--raio-botao);
    background: var(--acao);
    color: var(--acao-texto);
    font-family: inherit;
    font-size: 1rem;
    line-height: 1.2;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
  }
  .botao:focus-visible { outline: 2px solid var(--foco); outline-offset: 3px; }
  .botao:active:not(:disabled) { background: var(--acao-ativo); }
  button.botao:disabled { background: var(--inativo-fundo); color: var(--inativo-texto); cursor: not-allowed; }
  @media (hover: hover) {
    .botao:hover:not(:disabled) { background: var(--acao-hover); }
  }

  @media (min-width: 48rem) {
    :root { --vidro-blur: 20px; }
    body::before {
      background-image: radial-gradient(28rem 28rem at 40% 38%, var(--mancha-1) 0, transparent 60%), radial-gradient(24rem 24rem at 62% 62%, var(--mancha-2) 0, transparent 60%), radial-gradient(32rem 32rem at 50% 95%, var(--mancha-3) 0, transparent 60%);
    }
    .palco { padding: var(--e12); }
    .cartao { padding: var(--e7); }
    .cartao__titulo { font-size: 1.0625rem; }
    .cartao__saldo { font-size: 2.5rem; }
    .cartao__saldo--longo { font-size: 2rem; }
    .botao { width: auto; min-height: 44px; padding: 0 var(--e6); align-self: flex-start; }
  }

  /* Reservas do vidro, nesta ordem, depois da base de .cartao. */
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .cartao { background: var(--vidro-reserva); }
  }
  @media (prefers-reduced-transparency: reduce) {
    .cartao { background: var(--vidro-opaco); -webkit-backdrop-filter: none; backdrop-filter: none; }
  }
  @media (prefers-contrast: more) {
    .cartao { background: var(--vidro-opaco); border: 2px solid var(--texto-1); box-shadow: none; }
    /* html:root ganha do :root do tema escuro em qualquer ordem: vale nos dois temas. */
    html:root { --texto-2: var(--texto-1); }
  }

  /* Movimento só para quem não pediu menos movimento; nunca anima o desfoque. */
  @media (prefers-reduced-motion: no-preference) {
    @keyframes cartao-entrada {
      from { opacity: .6; transform: translateY(8px) scale(.98); }
    }
    .cartao { animation: cartao-entrada 400ms cubic-bezier(0.16, 1, 0.3, 1); }
    .botao { transition: background-color 120ms, transform 120ms; }
    .botao:active:not(:disabled) { transform: scale(.98); }
  }
</style>
</head>
<body>
<main class="palco">
  <section class="cartao" aria-labelledby="t-saldo">
    <h1 id="t-saldo" class="cartao__titulo">Saldo disponível</h1>
    <p class="cartao__saldo"><data value="12480.35">R$&nbsp;12.480,35</data></p>
    <p class="cartao__variacao cartao__variacao--positiva">
      <svg class="cartao__seta" aria-hidden="true" focusable="false" width="12" height="12" viewBox="0 0 12 12"><path d="M6 2 11 10H1z" fill="currentColor"/></svg>
      <span class="sr">Aumento de</span>
      <span class="num">+R$&nbsp;1.236,90 (+11,0%)</span>
      <span class="cartao__periodo">em outubro de 2026</span>
    </p>
    <p class="cartao__meta">Conta corrente · Ag. 0001 · CC 12345-6</p>
    <p class="cartao__meta">Atualizado em <time datetime="2026-11-01T09:42-03:00">01/11/2026 às 09:42</time></p>
    <button type="button" class="botao">Transferir</button>
    <p class="cartao__status" role="status"></p>
    <p class="cartao__aviso">Dados fictícios de demonstração.</p>
  </section>
</main>

<!-- Modelos dos outros estados de dado (inertes: a demo não os mostra). -->
<template id="modelo-variacao-negativa">
  <p class="cartao__variacao cartao__variacao--negativa">
    <svg class="cartao__seta" aria-hidden="true" focusable="false" width="12" height="12" viewBox="0 0 12 12"><path d="M6 10 1 2h10z" fill="currentColor"/></svg>
    <span class="sr">Queda de</span>
    <span class="num">−R$&nbsp;1.236,90 (−11,0%)</span>
    <span class="cartao__periodo">em outubro de 2026</span>
  </p>
</template>
<template id="modelo-variacao-zero">
  <p class="cartao__variacao cartao__variacao--zero">
    <span class="num">R$&nbsp;0,00 (0,0%)</span>
    <span class="cartao__periodo">em outubro de 2026</span>
  </p>
</template>

<script>
  (function () {
    'use strict';
    var botao = document.querySelector('.botao');
    var status = document.querySelector('.cartao__status');
    botao.addEventListener('click', function () {
      status.textContent = 'Demonstração: nenhuma transferência foi feita.';
    });
  })();
</script>
</body>
</html>
